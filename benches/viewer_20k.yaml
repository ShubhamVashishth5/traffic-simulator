name: viewer_20k
description: >
  Viewer frame benchmark (plan P4.2, P4.3): 18 parallel 5 km x 10.5 m carriageways, 15 m
  apart, each loaded with the dense-corridor demand so the network holds about 20,000
  vehicles after 15 minutes. Not a calibrated scenario.
