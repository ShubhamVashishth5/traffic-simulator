name: barrier_queue
description: >
  P5.6 reference scenario: queues at a barrier that closes for 120 s in every 300 s (a level
  crossing or a police barrier; signals arrive in P7) on a 10.5 m carriageway, with the
  Delhi-arterial composition of the reference corridor. Used to check that two-wheelers seep
  through the queue towards the stop line and that the queue discharges when it opens.
duration_s: 1200
warmup_s: 0
dt_s: 0.1
network:
  ribbons:
    - id: main
      polyline: [[0, 0], [800, 0]]
      width: [{s: 0, y_min: -5.25, y_max: 5.25}]
  barriers:
    - id: crossing
      ribbon: main
      s: 600
      closed:
        - {from_s: 60, to_s: 180}
        - {from_s: 360, to_s: 480}
        - {from_s: 660, to_s: 780}
        - {from_s: 960, to_s: 1080}
demand:
  entries:
    - id: west
      ribbon: main
      flow:
        - {from_s: 0, veh_per_h: 2400}
      composition:
        motorcycle: 0.12
        scooter: 0.12
        moped: 0.03
        auto_rickshaw: 0.14
        e_rickshaw: 0.02
        hatchback: 0.30
        sedan: 0.12
        suv: 0.08
        lcv: 0.03
        bus: 0.02
        truck: 0.01
        bicycle: 0.01
detectors:
  - {kind: screenline, id: s605, ribbon: main, s: 605, interval_s: 60}
  - {kind: screenline, id: s750, ribbon: main, s: 750, interval_s: 300}
  - {kind: area, id: queue_area, ribbon: main, s_from: 300, s_to: 600, interval_s: 60}
kpi:
  throughput_detector: s750
outputs:
  trajectories: {every_s: 0.5}
