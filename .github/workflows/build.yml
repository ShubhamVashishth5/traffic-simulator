name: build

# Builds the distributable artifacts on every push to master, every pull
# request, every `v*` tag, and on demand:
#
# - the `marg` CLI: Linux x86_64 static (musl; runs on any Linux, e.g. HPC
#   clusters and the Apptainer image in deploy/marg.def), Linux x86_64 (glibc;
#   about 7% faster), Windows x86_64 (MSVC; a .zip) and, opt-in, macOS arm64,
#   each packaged with the parameter register and the shipped scenarios;
# - Python wheels (abi3: one wheel per platform for Python >= 3.11) and the
#   source distribution;
# - the web viewer bundle.
#
# Every CLI build also runs three scenarios with seed 1 and reports their
# output hashes; the `same-results` job fails unless every build reports the
# same ones (results are bitwise identical on every platform, ADR-0003).
#
# macOS builds are opt-in: set the repository variable BUILD_MACOS to `true`
# (Settings → Secrets and variables → Actions → Variables) once macOS runners
# are available to the repository. Without them GitHub cancels the jobs.
#
# Every binary and wheel is smoke-tested by running a scenario before upload.
# Artifacts are attached to the workflow run; a `v*` tag also publishes them as
# a GitHub release. The tag must match the workspace version in Cargo.toml, and
# CHANGELOG.md must have a section for it: that section is the release's body.
# 0.x versions are published as pre-releases (research previews, uncalibrated).

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan platforms
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.plan.outputs.cli }}
      wheels: ${{ steps.plan.outputs.wheels }}
    steps:
      - id: plan
        env:
          BUILD_MACOS: ${{ vars.BUILD_MACOS }}
        run: |
          cli='{"name":"linux-x86_64-musl","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"}'
          cli="$cli"',{"name":"linux-x86_64-gnu","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}'
          cli="$cli"',{"name":"windows-x86_64","os":"windows-latest","target":"x86_64-pc-windows-msvc","exe":".exe"}'
          wheels='{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64"}'
          wheels="$wheels"',{"name":"windows-x86_64","os":"windows-latest","target":"x64"}'
          if [ "$BUILD_MACOS" = "true" ]; then
            mac='{"name":"macos-arm64","os":"macos-14","target":"aarch64-apple-darwin"}'
            cli="$cli,$mac"
            wheels="$wheels,$mac"
          else
            echo "::notice::macOS builds are off; set the repository variable BUILD_MACOS=true to build them"
          fi
          echo "cli={\"include\":[$cli]}" >> "$GITHUB_OUTPUT"
          echo "wheels={\"include\":[$wheels]}" >> "$GITHUB_OUTPUT"

  cli:
    name: marg CLI (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cli) }}
    defaults:
      run:
        # Git Bash on Windows (it has tar, sha256sum and 7z on the runner).
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl C toolchain (zstd is C)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p marg-cli
      - name: Check the musl binary is static
        if: contains(matrix.target, 'musl')
        run: |
          if ldd target/${{ matrix.target }}/release/marg 2>&1 | grep -q "=>"; then
            echo "::error::marg is dynamically linked"; exit 1
          fi
      - name: Smoke test
        env:
          MARG_PARAMS_DIR: params/base
        run: |
          bin=target/${{ matrix.target }}/release/marg${{ matrix.exe }}
          "$bin" version
          "$bin" run scenarios/free_flow_early_morning.yaml --seed 1 --out "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/kpis.parquet"
      - name: Output hashes (compared across builds by `same-results`)
        env:
          MARG_PARAMS_DIR: params/base
        run: |
          bin=target/${{ matrix.target }}/release/marg${{ matrix.exe }}
          mkdir -p hashes
          for s in corridor_2km priority_crossing signal_crossing; do
            "$bin" run "scenarios/$s.yaml" --seed 1 --out "$RUNNER_TEMP/hash-$s" > /dev/null
            h=$(sed -n 's/.*"output_hash": *"\([0-9a-f]*\)".*/\1/p' "$RUNNER_TEMP/hash-$s/manifest.json")
            if [ -z "$h" ]; then echo "::error::no output_hash for $s"; exit 1; fi
            echo "$s $h" | tee -a "hashes/hashes-${{ matrix.name }}.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hashes-${{ matrix.name }}
          path: hashes/hashes-${{ matrix.name }}.txt
          if-no-files-found: error
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="${GITHUB_SHA::8}"; fi
          dir="marg-$ver-${{ matrix.name }}"
          bin="marg${{ matrix.exe }}"
          mkdir -p "dist/$dir/scenarios"
          cp "target/${{ matrix.target }}/release/$bin" "dist/$dir/"
          # MSVC keeps debug info in a separate .pdb, so there is nothing to strip.
          if [ "$RUNNER_OS" != Windows ]; then strip "dist/$dir/$bin"; fi
          cp -R params LICENSE README.md "dist/$dir/"
          cp scenarios/*.yaml "dist/$dir/scenarios/"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$dir.zip"
            (cd dist && 7z a -tzip "$archive" "$dir" > /dev/null)
          else
            archive="$dir.tar.gz"
            tar -C dist -czf "dist/$archive" "$dir"
          fi
          if command -v sha256sum > /dev/null; then sum=sha256sum; else sum="shasum -a 256"; fi
          (cd dist && $sum "$archive" > "$archive.sha256" && cat "$archive.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  same-results:
    name: Same results on every build
    needs: [plan, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hashes-*
          path: hashes
          merge-multiple: true
      - name: Every build reports the same output hashes
        env:
          CLI: ${{ needs.plan.outputs.cli }}
        run: |
          cd hashes
          want=$(echo "$CLI" | jq '.include | length')
          got=$(ls hashes-*.txt | wc -l)
          if [ "$got" -ne "$want" ]; then
            echo "::error::$got of $want builds reported hashes"; exit 1
          fi
          ref=hashes-linux-x86_64-gnu.txt
          fail=0
          for f in hashes-*.txt; do
            echo "== $f"; cat "$f"
            if ! diff -u "$ref" "$f"; then
              echo "::error::${f#hashes-} gives different results from ${ref#hashes-}"; fail=1
            fi
          done
          exit $fail

  wheels:
    name: Python wheel (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wheels) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --strip --out dist
          manylinux: auto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test the installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          MARG_PARAMS_DIR="$GITHUB_WORKSPACE/params/base" python -c "
          import marg, sys
          print('marg', marg.version())
          r = marg.run(sys.argv[1], seed=1, out='smoke')
          assert r.manifest['status'] == 'ok', r.manifest
          print('throughput', r.kpis['throughput_veh_h'])
          # An experiment runs through \`python -m marg batch\` when no CLI is installed.
          exp = marg.Experiment('smoke', sys.argv[1], replications=marg.Replications(n=2))
          exp.run(marg.backends.Local(workers=2))
          import polars as pl
          files = exp.data().files('kpis')
          seen = pl.scan_parquet(files, include_file_paths='f').collect()['f'].to_list()
          print('run files', files, 'as Polars reports them', seen)
          res = exp.results('kpis')
          assert res.height == 2, (res.height, exp.data().index().select('status', 'path').rows())
          " "$GITHUB_WORKSPACE/scenarios/free_flow_early_morning.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  web:
    name: Web viewer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="${GITHUB_SHA::8}"; fi
          mkdir -p dist
          tar -C web/dist -czf "dist/marg-web-$ver.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, same-results, wheels, sdist, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$v"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Keep only the release files (drop the hash reports)
        run: rm -f artifacts/hashes-*.txt && ls -l artifacts
      - name: Release notes from CHANGELOG.md
        env:
          LINK_BASE: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}
        run: ./scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/notes.md
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') || contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
