name: build

# Builds the distributable artifacts on every push to master, every pull
# request, every `v*` tag, and on demand:
#
# - the `marg` CLI: Linux x86_64 static (musl; runs on any Linux, e.g. HPC
#   clusters and the Apptainer image in deploy/marg.def), Linux x86_64 (glibc;
#   about 7% faster) and, opt-in, macOS arm64, each packaged with the parameter register
#   and the shipped scenarios;
# - Python wheels (abi3: one wheel per platform for Python >= 3.11) and the
#   source distribution;
# - the web viewer bundle.
#
# macOS builds are opt-in: set the repository variable BUILD_MACOS to `true`
# (Settings → Secrets and variables → Actions → Variables) once macOS runners
# are available to the repository. Without them GitHub cancels the jobs.
#
# Every binary and wheel is smoke-tested by running a scenario before upload.
# Artifacts are attached to the workflow run; a `v*` tag also publishes them as
# a GitHub release (the tag must match the workspace version in Cargo.toml).

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan platforms
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.plan.outputs.cli }}
      wheels: ${{ steps.plan.outputs.wheels }}
    steps:
      - id: plan
        env:
          BUILD_MACOS: ${{ vars.BUILD_MACOS }}
        run: |
          cli='{"name":"linux-x86_64-musl","os":"ubuntu-latest","target":"x86_64-unknown-linux-musl"}'
          cli="$cli"',{"name":"linux-x86_64-gnu","os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu"}'
          wheels='{"name":"linux-x86_64","os":"ubuntu-latest","target":"x86_64"}'
          if [ "$BUILD_MACOS" = "true" ]; then
            mac='{"name":"macos-arm64","os":"macos-14","target":"aarch64-apple-darwin"}'
            cli="$cli,$mac"
            wheels="$wheels,$mac"
          else
            echo "::notice::macOS builds are off; set the repository variable BUILD_MACOS=true to build them"
          fi
          echo "cli={\"include\":[$cli]}" >> "$GITHUB_OUTPUT"
          echo "wheels={\"include\":[$wheels]}" >> "$GITHUB_OUTPUT"

  cli:
    name: marg CLI (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cli) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install the musl C toolchain (zstd is C)
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }} -p marg-cli
      - name: Check the musl binary is static
        if: contains(matrix.target, 'musl')
        run: |
          if ldd target/${{ matrix.target }}/release/marg 2>&1 | grep -q "=>"; then
            echo "::error::marg is dynamically linked"; exit 1
          fi
      - name: Smoke test
        env:
          MARG_PARAMS_DIR: params/base
        run: |
          bin=target/${{ matrix.target }}/release/marg
          "$bin" version
          "$bin" run scenarios/free_flow_early_morning.yaml --seed 1 --out "$RUNNER_TEMP/smoke"
          test -s "$RUNNER_TEMP/smoke/kpis.parquet"
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="${GITHUB_SHA::8}"; fi
          dir="marg-$ver-${{ matrix.name }}"
          mkdir -p "dist/$dir/scenarios"
          cp "target/${{ matrix.target }}/release/marg" "dist/$dir/"
          strip "dist/$dir/marg"
          cp -R params LICENSE README.md "dist/$dir/"
          cp scenarios/*.yaml "dist/$dir/scenarios/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          (cd dist && shasum -a 256 "$dir.tar.gz" > "$dir.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  wheels:
    name: Python wheel (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.wheels) }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --strip --out dist
          manylinux: auto
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke test the installed wheel
        run: |
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          MARG_PARAMS_DIR="$GITHUB_WORKSPACE/params/base" python -c "
          import marg, sys
          print('marg', marg.version())
          r = marg.run(sys.argv[1], seed=1, out='smoke')
          assert r.manifest['status'] == 'ok', r.manifest
          print('throughput', r.kpis['throughput_veh_h'])
          # An experiment runs through \`python -m marg batch\` when no CLI is installed.
          exp = marg.Experiment('smoke', sys.argv[1], replications=marg.Replications(n=2))
          exp.run(marg.backends.Local(workers=2))
          assert exp.results('kpis').height == 2
          " "$GITHUB_WORKSPACE/scenarios/free_flow_early_morning.yaml"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Python source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  web:
    name: Web viewer bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver="$GITHUB_REF_NAME"; else ver="${GITHUB_SHA::8}"; fi
          mkdir -p dist
          tar -C web/dist -czf "dist/marg-web-$ver.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [cli, wheels, sdist, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the workspace version
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$v"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
