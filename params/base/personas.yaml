    guide: "§3.1, §4.2"
    register_row: 9.3/skill_distraction
    range: [0.0, 3600.0]
    notes: "Distraction episodes per hour of driving for a phone user (Poisson). Required when traits.phone_use_share is set."
  distraction.episode_duration:
    value: null
    unit: "s"
    grade: C
    role: sweep
    source: "Guide §3.1; no duration found"
    guide: "§3.1, §4.2"
    register_row: 9.3/skill_distraction
    range: [0.0, 600.0]
    notes: "How long an episode lasts. While distracted a driver keeps its lateral target and does not re-read violation triggers (the user's decision, ADR-0018 part 6). Required when traits.phone_use_share is set."
  shift.average_commuter.aggressiveness:
    value: 0.0
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.2 (starter personas), words translated by ADR-0018 part 6"
    guide: "§3.2"
    register_row: 9.3/aggressiveness
    range: [-3.0, 3.0]
    notes: "Mean shift of aggressiveness for the average commuter, in SDs of the trait (personas are mean shifts, G§3.2). Guide: 'All traits at population mean'; aggressiveness: not named (at the mean). Word map (ADR-0018 part 6): at mean 0, low -1, moderate or unqualified +0.5, high +1, very high +1.5."
  shift.average_commuter.time_pressure:
