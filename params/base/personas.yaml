  delivery_rider.violation_intercept_shift:
    value: null
    unit: "1"
    grade: B
    role: fit
    stage: 6
    source: "Chennai observation (65% of riders violating in 2019, 73% in 2018)"
    guide: "§3.2"
    register_row: 9.3/delivery_rider_violation_propensity
    range: [-5.0, 5.0]
    notes: "Fit so the share of delivery riders violating matches the validation target."
  e_rickshaw.stop_rate:
    value: null
    unit: "1/h"
    grade: C
    role: sweep
    source: "Business Standard 2025 (Delhi challans: ranking only)"
    guide: "§3.2"
    register_row: 9.3/e_rickshaw_stop_propensity
    range: [0.0, 60.0]
    notes: "Poisson stop rate by land use; challans give a ranking (parking : wrong-way about 37 : 1), not a rate."
  links.critical_gap:
    value: 0.0
    unit: "1"
    grade: C
    role: fit
    stage: 6
    source: "Guide §3.1 and Dutta & Ahmed 2018 (younger, more aggressive drivers accept smaller gaps) name the link, not its size"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.0, 1.0]
    live: true
    notes: "r: normal-score correlation of an agent's critical gap with its kappa (a Gaussian copula, ADR-0018 part 5, K2): the gap's marginal stays the register's. Negative = aggressive drivers accept shorter gaps. 0 = independent (until fitted)."
  links.free_flow_speed:
    value: 0.0
    unit: "1"
    grade: C
    role: fit
    stage: 6
    source: "Guide §3.1 names the link (kappa scales v0), not its size"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.0, 1.0]
    notes: "r: normal-score correlation of an agent's desired speed v0 with its kappa (a Gaussian copula, ADR-0018 part 5, K2). The register's per-class distribution stays the marginal for a population with the register's kappa; positive = aggressive drivers want to go faster. 0 = independent (until fitted)."
  links.time_gap:
    value: 0.0
    unit: "1"
    grade: C
    role: fit
    stage: 6
    source: "Guide §3.1 names the link (kappa scales T), not its size"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.0, 1.0]
    notes: "r: normal-score correlation of an agent's IDM time gap T with its kappa (a Gaussian copula, ADR-0018 part 5, K2). The register's per-class distribution stays the marginal for a population with the register's kappa; negative = aggressive drivers follow closer. 0 = independent (until fitted)."
  links.standstill_gap:
    value: 0.0
    unit: "1"
    grade: C
    role: fit
    stage: 6
    source: "Guide §3.1 names the link (kappa scales s0), not its size"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.0, 1.0]
    notes: "r: normal-score correlation of an agent's IDM standstill gap s0 with its kappa (a Gaussian copula, ADR-0018 part 5, K2). The register's per-class distribution stays the marginal for a population with the register's kappa; negative = aggressive drivers stop closer. 0 = independent (until fitted)."
  links.max_accel:
    value: 0.0
    unit: "1"
    grade: C
    role: fit
    stage: 6
    source: "Guide §3.1 names the link (kappa scales a), not its size"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.0, 1.0]
    notes: "r: normal-score correlation of an agent's IDM maximum acceleration a with its kappa (a Gaussian copula, ADR-0018 part 5, K2). The register's per-class distribution stays the marginal for a population with the register's kappa; positive = aggressive drivers accelerate harder. 0 = independent (until fitted)."
  links.comfortable_decel:
    value: 0.0
    unit: "1"
    grade: C
    role: fit
    stage: 6
    source: "Guide §3.1 names the link (kappa scales b), not its size"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.0, 1.0]
    notes: "r: normal-score correlation of an agent's IDM comfortable deceleration b with its kappa (a Gaussian copula, ADR-0018 part 5, K2). The register's per-class distribution stays the marginal for a population with the register's kappa; positive = aggressive drivers brake later and harder. 0 = independent (until fitted)."
  links.time_pressure:
    value: 0.5
    unit: "1"
    grade: C
    role: sweep
    source: "Assumed (ADR-0018 part 2): one SD of the trait scales a coefficient by exp(0.5) = 1.65. Guide §3.1 says what the trait acts on, not how much"
    guide: "§3.1, §4.1"
    register_row: 9.3/time_pressure
    range: [0.0, 2.0]
    notes: "gamma: an agent's time pressure scales the time-saved and waiting-time coefficients of its violation rule by exp(+gamma * pi) (a random-coefficient logit)."
  links.risk_tolerance:
    value: 0.5
    unit: "1"
    grade: C
    role: sweep
    source: "Assumed (ADR-0018 part 2): one SD of the trait scales a coefficient by exp(0.5) = 1.65. Guide §3.1 says what the trait acts on, not how much"
    guide: "§3.1, §4.1"
    register_row: 9.3/risk_conformity_norm
    range: [0.0, 2.0]
    notes: "gamma: an agent's risk tolerance scales the perceived-risk coefficient of its violation rule by exp(-gamma * rho) (a random-coefficient logit)."
  links.conformity:
    value: 0.5
    unit: "1"
    grade: C
    role: sweep
    source: "Assumed (ADR-0018 part 2): one SD of the trait scales a coefficient by exp(0.5) = 1.65. Guide §3.1 says what the trait acts on, not how much"
    guide: "§3.1, §4.1"
    register_row: 9.3/risk_conformity_norm
    range: [0.0, 2.0]
    notes: "gamma: an agent's conformity scales the imitation coefficient for violators in view of its violation rule by exp(+gamma * c) (a random-coefficient logit)."
  links.norm_sensitivity:
    value: 0.5
    unit: "1"
    grade: C
    role: sweep
    source: "Assumed (ADR-0018 part 2): one SD of the trait scales a coefficient by exp(0.5) = 1.65. Guide §3.1 says what the trait acts on, not how much"
    guide: "§3.1, §4.1"
    register_row: 9.3/risk_conformity_norm
    range: [0.0, 2.0]
    notes: "gamma: an agent's norm sensitivity scales the enforcement coefficient and the imitation coefficient for compliers in view of its violation rule by exp(+gamma * eta) (a random-coefficient logit)."
  distraction.episode_rate:
    value: null
    unit: "1/h"
    grade: C
    role: sweep
