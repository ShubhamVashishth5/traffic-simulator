group: personas
description: "Driver traits and persona mix (G§3, §9.3). Used from phase P8."
entries:
  traits.aggressiveness.mean:
    value: 0
    unit: "1"
    grade: B
    role: sweep
    source: "IATSS Research 2022 (continuous trait, Mumbai)"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.5, 1.5]
    live: true
    notes: "kappa is standard normal in the population; personas shift its mean."
  traits.aggressiveness.sd:
    value: 1
    unit: "1"
    grade: B
    role: fit
    stage: 6
    source: "IATSS Research 2022; Traffic Injury Prevention 2021"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [0.0, 3.0]
    notes: "How kappa spread combines with per-class parameter spreads is decided in the P8.1 ADR."
  cooperative.squeeze_kappa_quantile:
    value: null
    unit: "1"
    grade: C
    role: scenario
    source: "Plan P3.3: cooperative twin arm (social efficiency deficit, G§8.4)"
    guide: "§3.1, §8.4"
    register_row: core/experiment_switches
    range: [0.0, 1.0]
    notes: "Unset = squeezing uses each agent's own kappa. When set (the cooperative twin), squeezing decisions use the kappa at this quantile of the population distribution instead. Read by the squeezing rule from P5; which quantile is pending (ADR-0007)."
