group: personas
description: "Driver traits and persona mix (G§3, §9.3). Used from phase P8."
entries:
  traits.aggressiveness.mean:
    value: 0
    unit: "1"
    grade: B
    role: sweep
    source: "IATSS Research 2022 (continuous trait, Mumbai)"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [-1.5, 1.5]
    live: true
    notes: "kappa is standard normal in the population; personas shift its mean."
  traits.aggressiveness.sd:
    value: 1
    unit: "1"
    grade: B
    role: fit
    stage: 6
    source: "IATSS Research 2022; Traffic Injury Prevention 2021"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [0.0, 3.0]
    notes: "kappa is linked to the per-class parameter spreads through a Gaussian copula (ADR-0018 part 5, K2): the register's per-class distributions stay the marginals for a population with this kappa distribution."
  links.clearance:
    value: 0.2
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.1 names the link, not its size. Bounded above by 0.29, the coefficient of variation of Budhkar & Maurya's residual if all of it were between drivers (ADR-0010)"
    guide: "§3.1"
    register_row: 9.3/aggressiveness
    range: [0.0, 1.0]
    live: true
    notes: "gamma_c: an agent's lateral clearances are scaled by exp(-gamma_c * kappa)."
  cooperative.squeeze_kappa_quantile:
    value: null
    unit: "1"
    grade: C
    role: scenario
    source: "Plan P3.3: cooperative twin arm (social efficiency deficit, G§8.4)"
    guide: "§3.1, §8.4"
    register_row: core/experiment_switches
    range: [0.0, 1.0]
    notes: "Unset = squeezing uses each agent's own kappa. When set (the cooperative twin), squeezing decisions use the kappa at this quantile of the population distribution instead. Read by the feasibility check of the lateral target choice (ADR-0010 §3); the quantile is the argument of marg.bundles.cooperative (ADR-0007)."
  traits.time_pressure:
    value: {dist: normal, mean: 0, sd: 1}
    unit: "1"
    grade: B/C
    role: sweep
    source: "Christie & Ward 2022 (UK gig riders)"
    guide: "§3.1"
    register_row: 9.3/time_pressure
    range: [-3.0, 3.0]
    notes: "Unit-free trait; personas shift its mean."
  traits.risk_tolerance:
    value: {dist: normal, mean: 0, sd: 1}
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.1"
    guide: "§3.1"
    register_row: 9.3/risk_conformity_norm
    range: [-3.0, 3.0]
    notes: "Unit-free trait; personas shift its mean."
  traits.conformity:
    value: {dist: normal, mean: 0, sd: 1}
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.1"
    guide: "§3.1"
    register_row: 9.3/risk_conformity_norm
    range: [-3.0, 3.0]
    notes: "Unit-free trait; personas shift its mean."
  traits.norm_sensitivity:
    value: {dist: normal, mean: 0, sd: 1}
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.1"
    guide: "§3.1"
    register_row: 9.3/risk_conformity_norm
    range: [-3.0, 3.0]
    notes: "Unit-free trait; personas shift its mean."
  traits.skill:
    value: {dist: normal, mean: 0, sd: 1}
    unit: "1"
    grade: C
    role: sweep
    source: "Bertrand et al. 2007 (licensing)"
    guide: "§3.1"
    register_row: 9.3/skill_distraction
    range: [-3.0, 3.0]
    notes: "Unit-free trait; personas shift its mean."
  traits.distraction:
    value: {dist: normal, mean: 0, sd: 1}
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.1"
    guide: "§3.1"
    register_row: 9.3/skill_distraction
    range: [-3.0, 3.0]
    notes: "Unit-free trait; personas shift its mean."
  traits.phone_use_share:
    value: null
    unit: "1"
    grade: C
    role: sweep
    source: "Guide §3.1 (delivery riders use phones far more)"
    guide: "§3.1"
    register_row: 9.3/skill_distraction
    range: [0.0, 1.0]
    notes: "Share of the population that uses a phone while driving: an agent is a phone user if its distraction trait is in the top share of the population distribution, so personas with a higher distraction mean have more phone users (ADR-0018 part 6). Unset: nobody has distraction episodes."
  traits.within_trip.reversion_rate:
    value: null
    unit: "1/h"
    grade: B
    role: fit
    stage: 6
    source: "Kesting & Treiber 2008; RSS 2022 (naturalistic data)"
    guide: "§3.1"
    register_row: 9.3/within_trip_kappa
    range: [0.0, 1000.0]
    notes: "Ornstein-Uhlenbeck reversion of kappa towards the agent's own mean (theta). Updated at each of the agent's decision ticks with the exact OU transition, so the process does not depend on the decision interval."
  traits.within_trip.sd:
    value: null
    unit: "1"
    grade: B
    role: fit
    stage: 6
    source: "Kesting & Treiber 2008; RSS 2022 (naturalistic data)"
    guide: "§3.1"
    register_row: 9.3/within_trip_kappa
    range: [0.0, 3.0]
    notes: "Stationary SD of an agent's kappa about its own mean under the Ornstein-Uhlenbeck process (ADR-0018 part 5); the noise is sd * sqrt(2 * reversion_rate). Unset (or reversion_rate unset): kappa stays at its value at entry."
  traits.within_trip.delay_jump:
    value: null
    unit: "1"
    grade: B
    role: fit
    stage: 6
    source: "Kesting & Treiber 2008; RSS 2022 (naturalistic data)"
    guide: "§3.1"
    register_row: 9.3/within_trip_kappa
    range: [0.0, 1000.0]
    notes: "Jump in kappa, once per trip, when the agent's accumulated delay (time so far minus free-flow time so far) first passes the threshold; it then reverts like any other deviation. Unset: no jump."
  traits.within_trip.delay_threshold:
    value: null
    unit: "s"
    grade: B
    role: fit
    stage: 6
    source: "Kesting & Treiber 2008; RSS 2022 (naturalistic data)"
    guide: "§3.1"
    register_row: 9.3/within_trip_kappa
    range: [0.0, 1000.0]
    notes: "Accumulated delay that triggers the jump."
  shares.average_commuter:
