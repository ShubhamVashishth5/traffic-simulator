[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "marg"
description = "Lane-free mixed-traffic simulator for Indian urban roads: research API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "pyyaml>=6",
    "pydantic>=2.7",
]

[project.optional-dependencies]
analysis = ["duckdb>=1.0", "matplotlib>=3.8", "SALib>=1.5", "scipy>=1.12"]

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "duckdb>=1.0",
    "scipy>=1.12",
    "datamodel-code-generator>=0.26",
]

[tool.maturin]
manifest-path = "crates/marg-py/Cargo.toml"
python-source = "python"
module-name = "marg._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["python/marg/_schema.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
